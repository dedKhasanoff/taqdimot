<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guruh Taqdimotlari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: top bar with search and admin login, grid of 10 group cards; a card opens that group's presentations (hash routing). Admins also see an upload form. */
:root{
  --bg:#f3f6f9; --surface:#ffffff; --ink:#0f2233; --muted:#5a6e80;
  --line:#dbe4ec; --accent:#0b6e8a; --accent-ink:#ffffff; --tint:#e3f1f6; --danger:#b3261e;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Onest","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1620; --surface:#14222f; --ink:#e8f0f6; --muted:#97aaba;
    --line:#25384a; --accent:#4fc0dd; --accent-ink:#06202b; --tint:#17303d; --danger:#ff8a80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1620; --surface:#14222f; --ink:#e8f0f6; --muted:#97aaba;
  --line:#25384a; --accent:#4fc0dd; --accent-ink:#06202b; --tint:#17303d; --danger:#ff8a80; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:16px;padding-bottom:16px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-weight:800;font-size:20px;text-decoration:none;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.search{flex:1 1 240px;max-width:360px}
.search input{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
h1{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,5vw,44px);line-height:1.1;margin:40px 0 8px;text-wrap:balance;letter-spacing:-.02em}
h2{font-family:var(--font-display);font-size:22px;margin:0 0 16px}
.lead{color:var(--muted);margin:0 0 28px;max-width:60ch}
.note{padding:14px 18px;border-radius:12px;background:var(--tint);color:var(--ink);margin:24px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;padding-bottom:56px}
.card{display:flex;flex-direction:column;gap:14px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:16px;text-decoration:none;transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 8px 24px rgba(11,110,138,.12)}
.card .num{font-family:var(--font-display);font-weight:800;font-size:44px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.card .name{font-weight:600}
.card .count{margin-top:auto;display:inline-flex;align-self:flex-start;padding:4px 10px;border-radius:99px;background:var(--tint);color:var(--accent);font-size:13px;font-weight:600}
.back{display:inline-flex;align-items:center;gap:6px;margin:28px 0 0;color:var(--accent);font-weight:600;text-decoration:none}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding-bottom:40px}
.pres{display:flex;flex-direction:column;gap:6px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.pres h3{margin:0;font-family:var(--font-display);font-size:19px;line-height:1.25;text-wrap:balance}
.pres .by{color:var(--muted);font-size:15px}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;padding:9px 16px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;font-size:15px;text-decoration:none;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn[disabled]{opacity:.55;cursor:default}
.viewbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.frame{position:relative;width:100%;aspect-ratio:16/10;max-height:80vh;min-height:320px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:56px}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.frame:fullscreen{border-radius:0;max-height:none;border:0}
@media (max-width:600px){.frame:not(.deck){aspect-ratio:4/3}}
.deck{display:flex;align-items:center;justify-content:center;aspect-ratio:16/9;min-height:0;background:#fff;user-select:none;-webkit-user-select:none;outline:none}
.deck canvas{display:block}
.deck.loading::after{content:"Slaydlar yuklanmoqda…";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#5a6e80}
.deck .nav{position:absolute;top:0;bottom:0;width:22%;border:0;background:transparent;color:transparent;font-size:44px;cursor:pointer}
.deck .prev{left:0}.deck .next{right:0}
.deck .nav:hover:not([disabled]),.deck .nav:focus-visible{color:rgba(15,34,51,.55)}
.deck .nav[disabled]{cursor:default}
.deck .counter{position:absolute;right:10px;bottom:10px;padding:3px 10px;border-radius:99px;background:rgba(15,34,51,.7);color:#fff;font-size:13px;font-variant-numeric:tabular-nums}
.deck:fullscreen{background:#000}
.pres .thumb{display:block;text-decoration:none;margin:-20px -20px 10px;aspect-ratio:16/9;background:var(--tint);border-bottom:1px solid var(--line);border-radius:16px 16px 0 0;overflow:hidden}
.pres .thumb img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .2s}
.pres .thumb:hover img{transform:scale(1.03)}
.pres .thumb .ph{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--accent);font-weight:600;font-size:13px;letter-spacing:.08em}
.pres .thumb .ph b{font-family:var(--font-display);font-size:44px;line-height:1;letter-spacing:-.02em}
.pres .admin-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn.small{padding:6px 12px;font-size:14px}
@media (prefers-reduced-motion:reduce){.pres .thumb img{transition:none}.pres .thumb:hover img{transform:none}}
.empty{padding:32px;border:1px dashed var(--line);border-radius:16px;color:var(--muted);margin-bottom:40px}
.upload{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:56px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.upload h2{grid-column:1/-1;margin:0}
.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px}
.field input[type=text],.field input[type=email],.field input[type=password],.field input[type=file]{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-weight:400}
.field small{font-weight:400;color:var(--muted)}
.upload .actions{grid-column:1/-1;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.status{color:var(--muted)}
.status.err{color:var(--danger)}
.authbar{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.authbar .btn{padding:7px 12px;font-size:14px}
.login{max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;margin:24px 0 56px;display:grid;gap:16px}
.login input{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-weight:400}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:14px;padding:20px 0}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#" id="home">Guruh<span>Taqdimotlari</span></a>
    <div class="search"><input id="q" type="search" placeholder="Taqdimot yoki o'quvchi izlash" aria-label="Qidirish"></div>
    <div id="auth"></div>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer><div class="wrap">101–110 guruhlar o'quvchilarining taqdimotlari</div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.93.3/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
